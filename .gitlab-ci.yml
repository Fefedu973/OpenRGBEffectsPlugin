#-----------------------------------------------------------#
# GitLab CI Rules                                           #
#                                                           #
# * For downstream forks (not on OpenRGBDevelopers/         #
#   OpenRGBEffectsPlugin), run only if manually started to  #
#   save CI minutes if GitLab hosted runners                #
# * For commits to the OpenRGBDevelopers/                   #
#   OpenRGBEffectsPlugin repository, automatically run all  #
#   jobs on the default branch, otherwise run them if the   #
#   source is part of a merge request                       #
#-----------------------------------------------------------#
.downstream_rules:
  rules:
  - if: $CI_PROJECT_PATH != "OpenRGBDevelopers/OpenRGBEffectsPlugin" && $CI_PIPELINE_SOURCE == "push"
    when: manual
    allow_failure: true

.upstream_rules:
  rules:
  - if: '$CI_PROJECT_PATH == "OpenRGBDevelopers/OpenRGBEffectsPlugin" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event")'
    when: on_success
  - !reference [.downstream_rules, rules]

.shared_windows_runners:
  tags:
  - shared-windows
  - windows
  - windows-1809

stages:
  - build
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

before_script:
 - echo "started by ${GITLAB_USER_NAME}"

#reusable templates
.ccache_init: &ccache_init
  before_script:
    - export APPIMAGE_EXTRACT_AND_RUN=1

#-----------------------------------------------------------#
# Common Linux Build Steps                                  #
#-----------------------------------------------------------#
.hidden_linux_script: &linux_script_steps
  image: registry.gitlab.com/openrgbdevelopers/openrgb-linux-ci-deb-builder:trixie-${TGT_ARCH}
  tags:
  - linux
  - ${TGT_ARCH}
  stage: build
  script:
  - export $(dpkg-architecture)
  - ./scripts/build-plugin.sh ${TGT_QT}

  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_${TGT_NAME}_${CI_COMMIT_SHORT_SHA}"
    paths:
    - ./libOpenRGBEffectsPlugin.so
    expire_in: 30 days

  rules:
    - !reference [.upstream_rules, rules]
  
