#-----------------------------------------------------------#
# Linux (.rpm) Fedora 44 amd64 Build Target                 #
#-----------------------------------------------------------#
"Linux amd64 .rpm (Fedora 44)":
  image: fedora:44
  stage: build
  script:
  - dnf install rpmdevtools dnf-plugins-core libcurl-devel qt6-qtbase-devel git wget -y
  - rpmdev-setuptree
  - ./scripts/build-package-files.sh fedora/OpenRGBEffectsPlugin.spec
  - cp fedora/OpenRGBEffectsPlugin.spec /root/rpmbuild/SPECS
  - cp -rp . /root/rpmbuild/SOURCES/OpenRGBEffectsPlugin
  - cd /root/rpmbuild
  - dnf builddep SPECS/OpenRGBEffectsPlugin.spec -y
  - rpmbuild -ba SPECS/OpenRGBEffectsPlugin.spec
  - cd RPMS/x86_64/
  - mv openrgb*.rpm ${CI_PROJECT_DIR}/
  - cd ${CI_PROJECT_DIR}

  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_amd64_rpm_${CI_COMMIT_SHORT_SHA}"
    paths:
    - openrgb-plugin-effects*.rpm
    expire_in: 30 days

  rules:
    - !reference [.upstream_rules, rules]

#-----------------------------------------------------------#
# Common Flatpak Build Steps                                #
#-----------------------------------------------------------#
.hidden_flatpak_script: &flatpak_script_steps
  image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
  stage: build
  tags:
  - linux
  - ${TGT_ARCH}
  before_script:
  - curl --location --output artifacts.zip ${TGT_UPSTREAM_URL}
  - unzip artifacts.zip
  - flatpak install --user --assumeyes org.openrgb.OpenRGB.flatpak
  script:
  - flatpak-builder --user --disable-rofiles-fuse --repo=build/repo build/flatpak-build flatpak/org.openrgb.OpenRGB.Plugin.Effects.yaml
  - flatpak build-bundle --runtime build/repo org.openrgb.OpenRGB.Plugin.Effects.flatpak org.openrgb.OpenRGB.Plugin.Effects 5

  artifacts:
    name: "${CI_PROJECT_NAME}_Linux_${TGT_ARCH}_Flatpak_${CI_COMMIT_SHORT_SHA}"
    paths:
    - org.openrgb.OpenRGB.Plugin.Effects.flatpak
    expire_in: 30 days

  rules:
    - !reference [.upstream_rules, rules]

#-----------------------------------------------------------#
# Linux Flatpak amd64 Build Target                          #
#-----------------------------------------------------------#
"Linux amd64 Flatpak":
  variables:
    TGT_UPSTREAM_URL: "https://gitlab.com/CalcProgrammer1/OpenRGB/-/jobs/artifacts/master/download?job=Linux+amd64+Flatpak"
    TGT_ARCH: "amd64"
  <<: *flatpak_script_steps

